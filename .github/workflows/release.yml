name: Release

# Every push to main builds the backend image and stores it in GitHub Container Registry,
# so there is always a ready-to-deploy image (ghcr.io/<owner>/<repo>-backend)
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write # needed to push to ghcr.io with GITHUB_TOKEN

jobs:
  publish-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags the image with the commit SHA (e.g. sha-a569e00) and "latest"
      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
