name: CI

# Runs on every push (any branch) and on every pull request
on:
  push:
  pull_request:

permissions:
  contents: read

# If you push again before the last run finished, cancel the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Only "true"/"false", so the token itself isn't exposed to every step
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    defaults:
      run:
        working-directory: Backend

    # HousemateSolutionApplicationTests starts the whole app, which needs a database
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: housemate
          POSTGRES_USER: housemate
          POSTGRES_PASSWORD: housemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U housemate -d housemate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # SonarQube Cloud needs the full git history to tell new code from old

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # "build" compiles, runs the tests, writes the coverage report and makes the jar in one go
      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: housemate
          DB_USERNAME: housemate
          DB_PASSWORD: housemate

      # The dependency jars Gradle downloaded, so the Java rules know the libraries' types
      - name: Find dependency jars for SonarQube Cloud
        if: env.HAS_SONAR_TOKEN == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "SONAR_JAVA_LIBRARIES=$HOME/.gradle/caches/modules-2/files-2.1/**/*.jar" >> "$GITHUB_ENV"

      # Analyzes Backend and Frontend (settings in sonar-project.properties) and fails when the
      # Quality Gate fails.
      # Only on pushes to main: the SonarQube Cloud Free plan can't analyze other branches or pull requests.
      # Skipped when the token isn't available.
      - name: SonarQube Cloud analysis
        if: env.HAS_SONAR_TOKEN == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.java.libraries=${{ env.SONAR_JAVA_LIBRARIES }}
            -Dsonar.java.test.libraries=${{ env.SONAR_JAVA_LIBRARIES }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Only checks that the Dockerfile still builds.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One check that is only green when everything above is green.
  # Make this the required check for the main branch in the GitHub settings.
  ci-ok:
    needs: [backend, frontend, docker]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check that all jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
