# SonarQube Cloud analysis, run by the "SonarQube Cloud analysis" step in .github/workflows/ci.yml
#
# Quality is judged against ISO/IEC 25010. SonarQube measures three of its quality characteristics,
# and the Quality Gate ("Sonar way", on new code) checks each of them:
#   Reliability      bugs                                -> no new reliability issues (faultlessness)
#   Security         vulnerabilities, security hotspots  -> no new security issues, all hotspots reviewed
#                                                           (confidentiality, integrity)
#   Maintainability  code smells                         -> no new maintainability issues (analysability, modifiability)
#                    duplicated code                     -> at most 3% duplication (modularity, reusability)
#                    test coverage                       -> at least 80% coverage (testability)
# The other characteristics (functional suitability, performance efficiency, compatibility,
# interaction capability, portability, safety) can't be measured by SonarQube.

sonar.projectKey=ineoaas_fontys-housemate
sonar.organization=ineoaas
sonar.host.url=https://sonarcloud.io

# What to analyze
sonar.sources=Backend/src/main/java,Frontend/src
sonar.tests=Backend/src/test/java
sonar.sourceEncoding=UTF-8

# Java needs the compiled classes (made by "./gradlew build" earlier in CI).
# The dependency jars (sonar.java.libraries) are passed in by ci.yml.
sonar.java.binaries=Backend/build/classes/java/main
sonar.java.test.binaries=Backend/build/classes/java/test
sonar.java.source=21

# Backend test coverage from JaCoCo
sonar.coverage.jacoco.xmlReportPaths=Backend/build/reports/jacoco/test/jacocoTestReport.xml

# The frontend has no test runner yet, so it would always show 0% coverage and fail the gate.
# It is still analyzed for bugs, vulnerabilities and code smells.
# TODO: remove this line once the frontend has tests (e.g. Vitest with an lcov report).
sonar.coverage.exclusions=Frontend/**

# Wait for the Quality Gate result and fail CI when the gate fails
sonar.qualitygate.wait=true
