services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: housemate
      POSTGRES_USER: housemate
      POSTGRES_PASSWORD: housemate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housemate -d housemate"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: housemate
      DB_USERNAME: housemate
      DB_PASSWORD: housemate
    ports:
      - "8080:8080"
