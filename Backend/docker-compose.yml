# For developing on your own laptop. The live site uses deploy/docker-compose.yml instead.

# Only the database (to run the backend from IntelliJ):  docker compose up -d dev-database
# Database + the app built from your local code:         docker compose up --build
name: housemate-dev

services:
  dev-database:
    image: postgres:17
    environment:
      POSTGRES_DB: housemate
      POSTGRES_USER: housemate
      POSTGRES_PASSWORD: housemate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housemate -d housemate"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # The image also contains the frontend, so it is built from the repository root
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    depends_on:
      dev-database:
        condition: service_healthy
    environment:
      DB_HOST: dev-database
      DB_PORT: "5432"
      DB_NAME: housemate
      DB_USERNAME: housemate
      DB_PASSWORD: housemate
    ports:
      - "8080:8080"
