services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: housemate
      MYSQL_USER: housemate
      MYSQL_PASSWORD: housemate
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: housemate
      DB_USERNAME: housemate
      DB_PASSWORD: housemate
    ports:
      - "8080:8080"

volumes:
  mysql_data:
